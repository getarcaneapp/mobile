plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.getarcane'
version = '1.0.0'

android {
  namespace "expo.modules.arcanefirebase"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
